# ==============================================================================
# Nagios Command Definitions: commands.cfg
# ==============================================================================
# Defines monitoring commands executed by the Nagios Core scheduler.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Base Network and Standard Service Commands
# ------------------------------------------------------------------------------

# Host Alive Check via ICMP Echo (Ping)
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Standard Network Ping Check
define command {
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

# Remote SSH Port Availability
define command {
    command_name    check_ssh
    command_line    $USER1$/check_ssh -H $HOSTADDRESS$ -p 22 -t 10
}

# Local HTTP Service Check (for Nagios Web UI)
define command {
    command_name    check_http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -p 80 -u /nagios/ -t 10
}

# ------------------------------------------------------------------------------
# 2. NRPE (Nagios Remote Plugin Executor) Command Definitions
# ------------------------------------------------------------------------------

# Execute remote check without additional arguments
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -t 20
}

# Execute remote check with arguments passed securely
define command {
    command_name    check_nrpe_args
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -a $ARG2$ -t 20
}

