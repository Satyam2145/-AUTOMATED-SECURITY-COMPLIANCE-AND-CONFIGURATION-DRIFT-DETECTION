# ==============================================================================
# Nagios Host Definitions: hosts.cfg
# ==============================================================================
# Defines the monitored EC2 nodes within the AWS VPC environment.
# ==============================================================================

# ------------------------------------------------------------------------------
# Generic Host Template
# ------------------------------------------------------------------------------
define host {
    name                            generic-ec2-node
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information      1
    retain_nonstatus_information   1
    check_command                   check-host-alive
    max_check_attempts              3
    check_interval                  2
    retry_interval                  1
    check_period                    24x7
    notification_interval           60
    notification_period             24x7
    notification_options            d,u,r
    register                        0
}

# ------------------------------------------------------------------------------
# EC2 Node 1: Management Server (Puppet Master + Nagios Core)
# ------------------------------------------------------------------------------
define host {
    use                             generic-ec2-node
    host_name                       sec-compliance-mgmt
    alias                           Puppet Master and Nagios Monitoring Authority
    address                         127.0.0.1
    hostgroups                      linux-servers,management-tier
}

# ------------------------------------------------------------------------------
# EC2 Node 2: Managed Client Node (Puppet Agent + NRPE)
# ------------------------------------------------------------------------------
define host {
    use                             generic-ec2-node
    host_name                       sec-compliance-client
    alias                           Managed Client Workload Server
    # Uses private DNS name or Private IP (configured in /etc/hosts)
    address                         client.ec2.internal
    hostgroups                      linux-servers,managed-tier
}

# ------------------------------------------------------------------------------
# Host Groups
# ------------------------------------------------------------------------------
define hostgroup {
    hostgroup_name                  linux-servers
    alias                           All Linux Servers
    members                         sec-compliance-mgmt,sec-compliance-client
}

define hostgroup {
    hostgroup_name                  management-tier
    alias                           Centralized Governance and Observability Tier
    members                         sec-compliance-mgmt
}

define hostgroup {
    hostgroup_name                  managed-tier
    alias                           Security Baseline Managed Nodes
    members                         sec-compliance-client
}

