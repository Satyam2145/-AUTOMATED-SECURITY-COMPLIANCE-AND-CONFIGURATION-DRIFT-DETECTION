# ==============================================================================
# Nagios Service Definitions: services.cfg
# ==============================================================================
# Defines service checks for infrastructure health, Puppet Agent status,
# and independent configuration drift detection probes.
# ==============================================================================

# ------------------------------------------------------------------------------
# Generic Service Template
# ------------------------------------------------------------------------------
define service {
    name                            generic-service
    active_checks_enabled           1
    passive_checks_enabled          1
    parallelize_check               1
    obsess_over_service             1
    check_freshness                 0
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information      1
    retain_nonstatus_information   1
    is_volatile                     0
    check_period                    24x7
    max_check_attempts              2
    check_interval                  2       ; Polled every 2 minutes for rapid drift detection
    retry_interval                  1       ; Re-checked every 1 minute on failure
    notification_options            w,u,c,r
    notification_interval           60
    notification_period             24x7
    register                        0
}

# ==============================================================================
# SECTION 1: MANAGEMENT SERVER SERVICES (sec-compliance-mgmt)
# ==============================================================================

define service {
    use                             generic-service
    host_name                       sec-compliance-mgmt
    service_description             Management PING
    check_command                   check_ping!100.0,20%!500.0,60%
}

define service {
    use                             generic-service
    host_name                       sec-compliance-mgmt
    service_description             SSH Service Status
    check_command                   check_ssh
}

define service {
    use                             generic-service
    host_name                       sec-compliance-mgmt
    service_description             Nagios Web Interface HTTP
    check_command                   check_http
}

# ==============================================================================
# SECTION 2: MANAGED CLIENT INFRASTRUCTURE CHECKS (sec-compliance-client)
# ==============================================================================

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             Client PING
    check_command                   check_ping!100.0,20%!500.0,60%
}

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             SSH Port 22 Reachability
    check_command                   check_ssh
}

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             CPU Load Average
    check_command                   check_nrpe!check_load
}

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             Root Filesystem Disk Space
    check_command                   check_nrpe!check_disk
}

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             Memory Utilization
    check_command                   check_nrpe!check_mem
}

define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             Puppet Agent Daemon Status
    check_command                   check_nrpe!check_puppet_agent
}

# ==============================================================================
# SECTION 3: INDEPENDENT SECURITY DRIFT DETECTION CHECKS (sec-compliance-client)
# ==============================================================================

# Drift Check 1: SSH Configuration Hardening (PermitRootLogin & Auth)
define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             DRIFT: SSH Security Hardening
    check_command                   check_nrpe!check_ssh_security
    notes                           Detects unauthorized modifications to /etc/ssh/sshd_config
}

# Drift Check 2: Essential Security Daemons (auditd, ufw, timesyncd)
define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             DRIFT: Security Services Execution
    check_command                   check_nrpe!check_services
    notes                           Detects stopped or disabled required security daemons
}

# Drift Check 3: Critical File Permissions Integrity (/etc/shadow, passwd, sshd)
define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             DRIFT: Critical File Permissions
    check_command                   check_nrpe!check_file_permissions
    notes                           Detects permission leaks on sensitive credential and auth files
}

# Drift Check 4: Comprehensive Security Compliance Rollup
define service {
    use                             generic-service
    host_name                       sec-compliance-client
    service_description             DRIFT: Security Baseline Compliance Rollup
    check_command                   check_nrpe!check_security_baseline
    notes                           Composite audit probe verifying full security baseline state
}

